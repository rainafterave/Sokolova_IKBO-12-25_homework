#= Настройки учебного робота =#
set SIDE = 3.
set SENSOR = begin
  MODEL := "Lidar";
  RANGE := 16.;
end
begin
  NAME := "Робот";
  MAP := begin
    AREA := ^(SIDE 2 pow());
    DIAGONAL := ^(SIDE 2 pow SIDE 2 pow + sqrt());
  end;
  SENSOR := ^(SENSOR);
  MOTORS := begin
    set SPEED = 5.
    LIMIT := ^(SPEED 1 +);
  end;
end
